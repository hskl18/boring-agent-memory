name: tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e . build
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run memory eval
        run: >
          bam eval --json
          --min-recall-at-1 1.0
          --min-recall-at-3 1.0
          --min-source-accuracy 1.0
          --min-snippet-term-rate 1.0
          --min-stale-detection-rate 1.0
          --max-privacy-leaks 0
      - name: Build package
        run: python -m build
